# hf_home: Hugging Face cache dir, keyed by platform. Relative paths are relative to the repo root
# (scripts chdir there via env.bootstrap()). On the GPU box, point `cuda` at the large disk.
hf_home:
  mac: ".hf_cache"
  cuda: "/lambda/nfs/filesys/hf_cache"   # the Lambda filesystem (persists across instances): model + lens downloaded once

runs_dir: "runs"
