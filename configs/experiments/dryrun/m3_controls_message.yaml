# DRY RUN (Mac), chain 2: position set "message", SPLIT band (early_late [[9, 13], [16, 18]]). Controls
# run: picks the control tokens and stops. Run before m3_positives_message.yaml.
#
#   python scripts/m3_controls.py --experiment configs/experiments/dryrun/m3_controls_message.yaml

name: controls_message
milestone: M3
position_set: message
band: early_late                 # dry run only -- the real M3 runs use the workspace band
from_m2_run: latest:loading
skip_first: 0
controls:
  n_per_kind: 3
  bars: [1.0, 0.75]
  pool_k: 100
  pair_pool: 20
  norm_scale: 1.0

dryrun:
  store: runs/dryrun/_hf
  lens_seed: 0
  bands_file: configs/experiments/dryrun/bands.yaml
