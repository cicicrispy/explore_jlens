# Your decision to continue although M1's causal positive control did not pass the spec's test
# (the expected token top-1 at alpha 1 or 2). Hand-written, after reading that M1 run's summary --
# no code writes this file. M2 and M3 accept an M1 validation run whose control did not pass ONLY if
# `validate_run` names exactly that run and `reason` is filled; the reason is quoted in their
# summaries, and this file is copied into every real M2/M3 run's settings/. (Decided 2026-09-11.)

validate_run: null   # the M1 run's folder name, e.g. validate_20260911-210000 (runs/M1/<this>)
reason: >-
  The clamped swap moves the answer towards 长 with alpha but does not flip it (validate_20260911-203842:
  大/长 logits clean 19.0/12.9, alpha 1 18.6/15.6, alpha 2 17.4/17.25). The paper's results are on
  Claude models; on Qwen3.6-27B the effect is smaller, but there is an effect, so the manipulation
  works. M3 effects may be smaller than the paper's for the same reason.
