language_tokens:
  es: ["Spanish", " Spanish", " spanish", "西班牙语"]
  fr: ["French",  " French",  " french",  "法语"]
pairs:                       # form-matched; order = (es, fr)
  plain:  ["Spanish", "French"]
  space:  [" Spanish", " French"]
  lower:  [" spanish", " french"]
  zh:     ["西班牙语", "法语"]
controls:
  # Control tokens are NOT hand-picked and NOT listed here: scripts/m3_grid.py picks them
  # automatically at the start of each positives run, from M2's saved top-100 lens readout at the
  # positions the treatment edits (rules: src/jlens_spec/controls.py; settings: the M3 experiment
  # files). No human approval step.
  # control_ineligible applies ONLY to the selection of CONTROL tokens. It has no effect on treatment
  # tokens, which come from `pairs` via pair_score. Its purpose: a control must be a non-label edit,
  # so no language-identity token may be chosen as a control -- neither these tokens nor any token
  # whose text contains one of them (case-insensitive). Extend it by hand; the next positives run
  # picks up the change.
  control_ineligible:               # language-identity tokens, any script
    ["Spanish"," Spanish"," spanish","French"," French"," french","西班牙语","法语","西班牙","法国",
     " español"," francés"," espagnol"," français"," langue"," idioma"," lengua"," bilingual"," translation"]
answers:
  # "yes"/"no" MUST stay quoted: YAML reads a bare yes / no key as true / false.
  "yes": ["Yes"]
  "no":  ["No"]
  hello: {es: ["Hola"], fr: ["Bonjour"]}
